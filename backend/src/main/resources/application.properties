# Optional machine-specific overrides (copy application-local.properties.example)
spring.config.import=optional:classpath:application-local.properties

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/projectmatch_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=projectmatch
spring.datasource.password=projectmatch
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8082

# Thymeleaf (REST API only — no templates bundled)
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.check-template-location=false

# JWT
app.jwt.secret=ProjectMatchSecretKey2024SuperLongSecretKeyForHMACSHA256Algorithm
app.jwt.expiration=86400000

# CORS (comma-separated origins for the Next.js frontend)
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# Logging
logging.level.com.projectmatch=DEBUG
